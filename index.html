<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catering App</title>
    <link rel="stylesheet" href="style.css">

    
</head>
<body>
  <nav class="navbar">
    <div class="nav-left">
      <a href="index.html">Home</a>
      <a href="product.html">View Products</a>
      <a href="cart.html">View Cart</a>
      <a href="orders.html">My Orders</a>
      <a href="admin.html">Admin Panel</a>
       
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </nav>

  <div class="container">
    <h1>Welcome to Catering App</h1>
    <h2>Register</h2>

    <!-- Register Form -->
    <div class="form-container">
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Password">
      <button onclick="register()">Register</button>
      <div id="loading-spinner" style="display: none;" class="spinner"></div>
    </div>

    <h2>Login</h2>
    <div class="form-container">
      <input type="email" id="login-email" placeholder="Email" />
      <input type="password" id="login-password" placeholder="Password" />
      <button onclick="login()">Login</button>
    </div>

   
    


    <h3 id="user-info" style="display: none;"></h3>
    <br>
     
     
    <h2>Place Catering Order for an Event</h2>
    <form class="form-container" id="eventForm" onsubmit="submitEvent(); return false;">
      <label for="eventName">Event Name</label>
      <input type="text" id="eventName" placeholder="e.g. Wedding, Birthday" required />
    
      <label for="eventDate">Date</label>
      <input type="date" id="eventDate" required />
    
      <label for="eventTime">Time</label>
      <input type="time" id="eventTime" required />
    
      <label for="numPeople">Number of People</label>
      <input type="number" id="numPeople" min="1" placeholder="e.g. 50" required />
    
      
    
      <button type="submit">Submit Event</button>
    </form>
    
    


    <h2>View Products</h2>
    <a href="product.html">
      <button>View Products</button>
    </a>
   
  </div>

  <!-- Firebase App (Core) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <!-- Firebase Authentication -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <!-- Firebase Firestore -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script src="script.js"></script>
</body>
</html>
